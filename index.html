<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deivisoft — Portfolio coming soon</title>
  <meta name="description" content="Deivisoft. Independent designer and developer. Portfolio coming soon.">
  <meta name="robots" content="noindex,follow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>D</text></svg>">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #fffdf8; color: #17201d;
      font-family: "Helvetica Neue", Arial, sans-serif;
      padding: 2rem;
    }
    main { max-width: 34rem; }
    .mark {
      width: 3.2rem; height: 3.2rem; display: grid; place-items: center;
      border: 2px solid #17201d; border-radius: 50%;
      font-weight: 700; font-size: 1.4rem; margin-bottom: 2rem;
    }
    h1 {
      margin: 0 0 1rem; font-size: clamp(2.6rem, 8vw, 4.5rem);
      line-height: .92; letter-spacing: -.05em; font-weight: 800;
    }
    p { margin: 0 0 .6rem; font-size: 1.05rem; line-height: 1.6; color: #3d4744; }
    a { color: #17201d; font-weight: 600; }
    footer { margin-top: 3rem; font-size: .8rem; color: #6b7570; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">D</div>
    <h1>Portfolio coming soon.</h1>
    <p>Deivisoft is rebuilding this site as a personal portfolio.</p>
    <p>For now, the best way to reach me is <a href="mailto:support@deivisoft.eu">support@deivisoft.eu</a>.</p>
    <footer>© <span id="y">2026</span> Deivisoft</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
